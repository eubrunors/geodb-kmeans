<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>GeoExplorer</title>

  <!-- Fonte moderna -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <h1>GeoExplorer</h1>
    <p class="subtitle">
      Explore e selecione cidades do mundo para análise
    </p>
  </header>

  <main class="container">
    <!-- COLUNA ESQUERDA -->
    <section class="card">
      <h2>Cidades da API</h2>

      <div class="status">
        <p id="loading" class="loading"></p>
        <p id="error" class="error"></p>
      </div>

      <!-- 🔥 wrapper APENAS da lista -->
      <div class="scroll-wrapper">
        <ul id="cities-list" class="city-list"></ul>
        <div class="scroll-fade"></div>
      </div>

      <div class="pagination">
        <button id="prev">Página anterior</button>
        <button id="next" class="primary">Próxima página</button>
      </div>
    </section>


    <!-- COLUNA DIREITA -->
    <section class="card">
      <h2>
        Cidades Selecionadas
        <span id="selected-count" class="count-badge">0</span>
      </h2>
      <ul id="selected-list" class="selected-list"></ul>
    </section>
  </main>

  <script src="main.js"></script>
</body>
</html>
